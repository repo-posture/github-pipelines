name: Wait for Docker
description: Wait until DinD/docker is reachable (self-hosted runners)
runs:
  using: composite
  steps:
    - name: Wait for Docker daemon
      shell: bash
      run: |
        set -euo pipefail
        echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
        for i in $(seq 1 60); do
          if docker info >/dev/null 2>&1; then
            docker version
            echo "Docker ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Docker daemon not ready" >&2
        exit 1
