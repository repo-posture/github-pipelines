name: Prepare non-container sample artifact
description: Build a tar.gz artifact under artifacts/github-scs-sample-app.tar.gz (ssca-plugin requires .tar or .tar.gz)
runs:
  using: composite
  steps:
    - name: Prepare tar.gz artifact
      shell: bash
      run: |
        set -eu
        rm -rf "${GITHUB_WORKSPACE}/sample-app" "${GITHUB_WORKSPACE}/artifacts"
        mkdir -p "${GITHUB_WORKSPACE}/sample-app" "${GITHUB_WORKSPACE}/artifacts"

        printf '%s\n' '{"name":"github-scs-sample-app","version":"1.0.0","description":"Sample app for SCS non-container testing","dependencies":{"express":"4.18.2","lodash":"4.17.21","axios":"1.6.2","moment":"2.29.4","uuid":"9.0.0"}}' \
          > "${GITHUB_WORKSPACE}/sample-app/package.json"
        echo '{"name":"github-scs-sample-app","version":"1.0.0","lockfileVersion":2,"requires":true,"packages":{}}' > "${GITHUB_WORKSPACE}/sample-app/package-lock.json"
        echo "binary-payload-$(date +%s)" > "${GITHUB_WORKSPACE}/sample-app/app.bin"
        echo "SCS GitHub non-container sample" > "${GITHUB_WORKSPACE}/sample-app/README.txt"

        OUT="${GITHUB_WORKSPACE}/artifacts/github-scs-sample-app.tar.gz"
        (cd "${GITHUB_WORKSPACE}" && tar -czf "$OUT" sample-app)
        ls -la "$OUT"
        echo "NON_CONTAINER_ARTIFACT_PATH=${OUT}" >> "$GITHUB_ENV"
