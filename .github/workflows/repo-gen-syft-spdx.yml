# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.repo-gen-syft-spdx
# Repo SBOM generation · Syft · spdx-json
name: "repo-gen-syft-spdx"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique id for Automation to resolve this run
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read

jobs:
  scs:
    name: Repo generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sample repository
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          REPO_URL: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/github-sbom-sample.git' }}
        run: |
          set -eux
          rm -rf repo
          ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['HARNESS_API_KEY'].strip(), safe=''))")
          if git clone --depth 1 -b main \
              "https://x-api-key:${ENC}@${REPO_URL#https://}" repo; then
            echo "Cloned from Harness Code"
          else
            echo "::warning::Harness Code clone failed (often 403 from GHA IPs); using fixtures/sbom-sample-repo"
            cp -a fixtures/sbom-sample-repo repo
            git -C repo init
            git -C repo remote remove origin 2>/dev/null || true
            git -C repo remote add origin "$REPO_URL"
          fi
          git -C repo remote set-url origin "$REPO_URL"
          ls -la repo
          test -f repo/npm/package-lock.json
      - name: Repository SBOM generation
        uses: ./v2/repo-sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          REPO_URL: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/github-sbom-sample.git' }}
          REPO_PATH: /
          REPO_VARIANT: main
          REPO_VARIANT_TYPE: branch
          REPO_CLONED_CODEBASE: ${{ github.workspace }}/repo
          SBOM_TOOL: Syft
          SBOM_FORMAT: spdx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "false"
      - name: SBOM policy enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: repository
          SBOM_SOURCE: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/github-sbom-sample.git' }}
          REPO_URL: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/github-sbom-sample.git' }}
          REPO_PATH: /
          REPO_VARIANT: main
          REPO_VARIANT_TYPE: branch
          REPO_CLONED_CODEBASE: ${{ github.workspace }}/repo
          VERIFY_SBOM: "false"
          POLICY_SET_REF: ${{ vars.OPA_REPO_POLICY_SET_REF || 'sbom_package_age_policy_set_for_at' }}
