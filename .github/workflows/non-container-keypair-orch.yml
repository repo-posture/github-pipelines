# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.non-container-keypair-orch
# Non-container orchestrate · keypair
name: "non-container-keypair-orch"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scs:
    name: Non-container orch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact
      - name: SBOM orchestrate
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_NAME: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/scs-sample-app.zip
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
