# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.non-container-keypair-orch
# Non-container orchestrate · keypair
name: "non-container-keypair-orch"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique id for Automation to resolve this run
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read

jobs:
  scs:
    name: Non-container orch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact
      - name: SBOM orchestrate
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-keypair-${{ github.run_number }}
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
