# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.container-keyless-acr
# Container · ACR · keyless
name: "container-keyless-acr"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
          username: ${{ secrets.ACR_CLIENT_ID }}
          password: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Build and push
        id: meta
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
        run: |
          set -eux
          IMAGE="${ACR}/scs-automation-test:${{ github.run_number }}-acr-kl"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ github.run_number }}" > Dockerfile
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  scs:
    name: SCS pipeline
    needs: [build]
    runs-on: ubuntu-latest
    env:
      FULCIO_URL: ${{ vars.FULCIO_QA_URL }}
      CLIENT_ID: ${{ secrets.ACR_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.ACR_CLIENT_SECRET }}
      TENANT_ID: ${{ vars.AZURE_TENANT_ID || 'b229b2bb-5f33-4d22-bce0-730f6474e906' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
          username: ${{ secrets.ACR_CLIENT_ID }}
          password: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM orchestrate (Syft)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM generation (cdxgen)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          SBOM_TOOL: cdxgen
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM enforce (cdxgen)
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          ATTEST_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          VERIFY_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}/scs-automation-test:${{ github.run_number }}-acr-kl
          SOURCE_TYPE: acr
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
