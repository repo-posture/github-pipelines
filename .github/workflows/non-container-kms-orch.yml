# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.non-container-kms-orch
# Non-container orchestrate · kms
name: "non-container-kms-orch"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scs:
    name: Non-container orch
    runs-on: [self-hosted, qpe-play]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact
      - name: SBOM orchestrate
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-kms
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "false"
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vaultqa.harness.io' }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-kms
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vaultqa.harness.io' }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-kms
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vaultqa.harness.io' }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-kms
          ATTEST_SLSA: "true"
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vaultqa.harness.io' }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          PLUGIN_WORKSPACE: ${{ github.workspace }}/artifacts/github-scs-sample-app.zip
          ARTIFACT_NAME: github-scs-sample-app.zip
          ARTIFACT_VERSION: local-orch-kms
          VERIFY_SLSA: "true"
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vaultqa.harness.io' }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
