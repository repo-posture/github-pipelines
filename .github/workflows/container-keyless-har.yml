# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.container-keyless-har
# Container · HAR · keyless
name: "container-keyless-har"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: pkg.qa0.harness.io
          username: ${{ secrets.HAR_USERNAME }}
          password: ${{ secrets.HAR_PASSWORD }}
      - name: Build and push
        id: meta
        env:
          HAR_PATH: ${{ vars.HAR_REPO_PATH || 'ppblw9yprharzps_jtwt7g/ssca_har_automation_registry/scs-automation-test' }}
        run: |
          set -eux
          TMP="autosscauser/scs-github-automation-test:${{ github.run_number }}-har-kl"
          IMAGE="pkg.qa0.harness.io/${HAR_PATH}:${{ github.run_number }}-har-kl"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ github.run_number }}" > Dockerfile
          docker build -t "$TMP" .
          docker push "$TMP"
          docker tag "$TMP" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  scs:
    name: SCS pipeline
    needs: [build]
    runs-on: ubuntu-latest
    env:
      FULCIO_URL: ${{ vars.FULCIO_QA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: pkg.qa0.harness.io
          username: ${{ secrets.HAR_USERNAME }}
          password: ${{ secrets.HAR_PASSWORD }}
      - name: SBOM orchestrate (Syft)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: harness
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: SBOM generation (cdxgen)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          SBOM_TOOL: cdxgen
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: harness
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: SBOM enforce (cdxgen)
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          ATTEST_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          VERIFY_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
      - name: SBOM enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: har
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.HAR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.HAR_PASSWORD }}
