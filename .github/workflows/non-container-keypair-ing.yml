# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.non-container-keypair-ing
# Non-container ingestion · keypair
name: "non-container-keypair-ing"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: UTC stamp from Automation (yyyyMMdd-HHmmss) — run title, image tags, and artifact versions
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read

jobs:
  scs:
    name: Non-container ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: |
          set -eux
          mkdir -p target
          echo "scenario=local-ing-keypair build=${{ inputs.correlation_id }}" > target/github-scs-automation-test.jar
      - name: Generate SBOM (Syft)
        run: |
          set -eux
          docker run --rm -v "$PWD:/work" -w /work anchore/syft:latest \
            "file:/work/target/github-scs-automation-test.jar" -o spdx-json=/work/sbom.json
      - name: SBOM ingest
        uses: ./v2/sbom-ingestion
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          PLUGIN_WORKSPACE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_NAME: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_VERSION: local-ing-keypair-${{ inputs.correlation_id }}
          PLUGIN_SBOMDESTINATION: ${{ github.workspace }}/sbom.json
          ATTEST_SBOM: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          PLUGIN_WORKSPACE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_NAME: github-scs-automation-test.jar
          ARTIFACT_VERSION: local-ing-keypair-${{ inputs.correlation_id }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          PLUGIN_WORKSPACE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_NAME: github-scs-automation-test.jar
          ARTIFACT_VERSION: local-ing-keypair-${{ inputs.correlation_id }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          PLUGIN_WORKSPACE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_NAME: github-scs-automation-test.jar
          ARTIFACT_VERSION: local-ing-keypair-${{ inputs.correlation_id }}
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          PLUGIN_WORKSPACE: ${{ github.workspace }}/target/github-scs-automation-test.jar
          ARTIFACT_NAME: github-scs-automation-test.jar
          ARTIFACT_VERSION: local-ing-keypair-${{ inputs.correlation_id }}
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
