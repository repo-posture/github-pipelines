# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.container-keypair-acr
# Container · ACR · keypair
name: "container-keypair-acr"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
          username: ${{ secrets.ACR_CLIENT_ID }}
          password: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Build and push
        id: meta
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
        run: |
          set -eux
          IMAGE="${ACR}/scs-automation-test:${{ github.run_number }}-acr-kp"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ github.run_number }}" > Dockerfile
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  scs:
    name: SCS pipeline
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER || 'sscatest.azurecr.io' }}
          username: ${{ secrets.ACR_CLIENT_ID }}
          password: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM orchestrate (Syft)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: harness
          ATTEST_SBOM: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
      - name: SBOM enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ needs.build.outputs.image }}
          SOURCE_TYPE: acr
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: ${{ secrets.ACR_CLIENT_ID }}
          DOCKER_PASSWORD: ${{ secrets.ACR_CLIENT_SECRET }}
