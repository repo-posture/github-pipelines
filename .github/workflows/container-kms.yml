# Container V2 E2E on QA.
# - SSCA plugin job: generation → ingestion → policy enforcement (sequential steps).
# - SLSA and artifact-signing jobs run in parallel; each runs its subcommands sequentially.
name: "V2 container-kms"

on:
  workflow_dispatch:
    inputs:
      attest:
        description: "Run KMS attestation and corresponding verification steps"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ssca:
    name: ssca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM generation (orchestrate)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          SBOM_TOOL: ${{ vars.SBOM_TOOL }}
          SBOM_FORMAT: ${{ vars.SBOM_FORMAT }}
          PLUGIN_SBOMDESTINATION: ${{ vars.SBOM_LOCAL_PATH }}
          ATTEST_SBOM: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve SBOM file for ingestion
        env:
          SBOM_LOCAL_PATH: ${{ vars.SBOM_LOCAL_PATH }}
        run: |
          mkdir -p "$SBOM_LOCAL_PATH"
          SBOM_FILE="$(ls -t "$SBOM_LOCAL_PATH"/sbom_*.json 2>/dev/null | head -1)"
          if [ -z "$SBOM_FILE" ]; then
            echo "No SBOM file under $SBOM_LOCAL_PATH" >&2
            exit 1
          fi
          echo "INGESTION_SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: SBOM ingestion (orchestrate)
        uses: ./v2/sbom-ingestion
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          PLUGIN_SBOMDESTINATION: ${{ env.INGESTION_SBOM_FILE }}
          ATTEST_SBOM: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM policy enforcement (enforce)
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          VERIFY_SBOM: ${{ inputs.attest }}
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  slsa-pipeline:
    name: slsa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SLSA provenance (attest)
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          ATTEST_SLSA: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: SLSA verification
        if: ${{ inputs.attest }}
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SLSA_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          VERIFY_SLSA: "true"
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  artifact-signing-pipeline:
    name: artifact-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Artifact signing
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Artifact verification
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SIGNING_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          SOURCE_TYPE: docker
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
