# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.container-keypair-ecr
# Container · ECR · keypair
name: "container-keypair-ecr"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique id for Automation to resolve this run
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: meta
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}
        run: |
          set -eux
          IMAGE="${ECR_REGISTRY}:${{ github.run_number }}-ecr-kp"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ github.run_number }}" > Dockerfile
          aws ecr create-repository --repository-name github-scs-automation-test --region "${{ vars.AWS_REGION || 'us-east-1' }}" 2>/dev/null || true
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  scs:
    name: SCS pipeline
    needs: [build]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: ECR password for plugins
        id: ecrpw
        run: |
          TOKEN=$(aws ecr get-login-password --region "${{ vars.AWS_REGION || 'us-east-1' }}")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: SBOM orchestrate (Syft)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SIGNING_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SIGNING_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
      - name: SBOM enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: ${{ vars.ECR_REGISTRY || '211125722538.dkr.ecr.us-east-1.amazonaws.com/github-scs-automation-test' }}:${{ github.run_number }}-ecr-kp
          SOURCE_TYPE: ecr
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: AWS
          DOCKER_PASSWORD: ${{ steps.ecrpw.outputs.token }}
