# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.repo-ingest
# Repo SBOM ingestion (pre-generated SPDX)
name: "repo-ingest"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scs:
    name: Repo ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sample repository
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          REPO_URL: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/sbom-direct-indirect-dependencies.git' }}
        run: |
          set -eux
          rm -rf repo
          ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['HARNESS_API_KEY'].strip(), safe=''))")
          if git clone --depth 1 -b main \
              "https://x-api-key:${ENC}@${REPO_URL#https://}" repo; then
            echo "Cloned from Harness Code"
          else
            echo "::warning::Harness Code clone failed (often 403 from GHA IPs); using fixtures/sbom-sample-repo"
            cp -a fixtures/sbom-sample-repo repo
            git -C repo init
            git -C repo remote remove origin 2>/dev/null || true
            git -C repo remote add origin "$REPO_URL"
          fi
          git -C repo remote set-url origin "$REPO_URL"
          ls -la repo
          test -f repo/npm/package-lock.json
      - name: Generate SBOM file (Syft SPDX)
        run: |
          set -eux
          docker run --rm -v "$PWD:/work" -w /work anchore/syft:latest \
            "dir:/work/repo" -o "spdx-json=/work/sbom.spdx.json"
      - name: SBOM ingest
        uses: ./v2/sbom-ingestion
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: repository
          SBOM_SOURCE: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/sbom-direct-indirect-dependencies.git' }}
          REPO_URL: ${{ vars.GIT_REPO_URL || 'https://git.qa0.harness.io/ppbLW9YpRharzPs_JtWT7g/SSCA/SSCA_Sanity_Automation/sbom-direct-indirect-dependencies.git' }}
          REPO_PATH: /
          REPO_VARIANT: main
          REPO_VARIANT_TYPE: branch
          REPO_CLONED_CODEBASE: ${{ github.workspace }}/repo
          PLUGIN_SBOMDESTINATION: ${{ github.workspace }}/sbom.spdx.json
          ATTEST_SBOM: "false"
