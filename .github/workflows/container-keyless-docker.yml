# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.container-keyless-docker
# Container · DOCKER · keyless
name: "container-keyless-docker"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique id for Automation to resolve this run
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        id: meta
        run: |
          set -eux
          IMAGE="docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ github.run_number }}" > Dockerfile
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  scs:
    name: SCS pipeline
    needs: [build]
    runs-on: ubuntu-latest
    env:
      FULCIO_URL: ${{ vars.FULCIO_QA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: SBOM orchestrate (Syft)
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SBOM generation (cdxgen)
        continue-on-error: true
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          SBOM_TOOL: cdxgen
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          PLUGIN_IMAGE: harness/ssca-cdxgen-plugin:0.69.0
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SBOM enforce (cdxgen)
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Artifact sign
        uses: ./v2/artifact-signing
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SIGNING_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Artifact verify
        uses: ./v2/artifact-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SIGNING_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          ATTEST_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          VERIFY_SLSA: "true"
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SBOM enforce
        continue-on-error: true
        uses: ./v2/sbom-policy-enforcement
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ github.run_number }}-kl
          SOURCE_TYPE: docker
          VERIFY_SBOM: "true"
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          PLUGIN_KEYLESS_TYPE: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
