# Mirrors jenkins-pipelines/pipelines/Jenkinsfile.section-d-keypair-attest
# Section D attest-only · keypair
name: "section-d-keypair-attest"
run-name: ${{ github.workflow }} [${{ inputs.correlation_id }}]


on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: UTC stamp from Automation (yyyyMMdd-HHmmss) — run title, image tags, and artifact versions
        required: true
        type: string
      harness_account_url:
        description: Harness account URL
        required: false
        type: string
        default: "https://qa0.harness.io"
      harness_account_id:
        description: Harness account id
        required: false
        type: string
        default: "ppbLW9YpRharzPs_JtWT7g"
      harness_org_id:
        description: Harness org id
        required: false
        type: string
        default: "SSCA"
      harness_project_id:
        description: Harness project id (Automation -Dproject target)
        required: false
        type: string
        default: "SSCA_Sanity_Automation"

permissions:
  contents: read

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        id: meta
        run: |
          set -eux
          IMAGE="docker.io/autosscauser/github-scs-automation-test:${{ inputs.correlation_id }}-d-keypair"
          printf 'FROM alpine:3.19\nLABEL build="%s"\n' "${{ inputs.correlation_id }}" > Dockerfile
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  scs:
    name: Attest
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: SBOM orchestrate + attest
        uses: ./v2/sbom-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SBOM_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ inputs.correlation_id }}-d-keypair
          SOURCE_TYPE: docker
          SBOM_TOOL: Syft
          SBOM_FORMAT: cyclonedx-json
          PLUGIN_SBOMDESTINATION: /tmp/sbom
          ATTEST_SBOM: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SLSA attest
        uses: ./v2/slsa-generation
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ inputs.correlation_id }}-d-keypair
          SOURCE_TYPE: docker
          ATTEST_SLSA: "true"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: SLSA verify
        uses: ./v2/slsa-verification
        with:
          HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
          HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
          HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
          SLSA_SOURCE: docker.io/autosscauser/github-scs-automation-test:${{ inputs.correlation_id }}-d-keypair
          SOURCE_TYPE: docker
          VERIFY_SLSA: "true"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
